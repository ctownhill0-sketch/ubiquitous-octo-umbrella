name: Build macOS DMG

# Builds an unsigned LeadStack DMG on a macOS runner and uploads it as a workflow
# artifact. Triggered manually, on pushes to main, or when a vX.Y.Z tag is pushed
# (which also creates a GitHub Release with the DMGs attached).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install root npm dependencies
        run: npm ci

      - name: Install frontend npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Package as macOS DMG (arm64 + x64)
        env:
          # Skip code signing for unsigned builds. To produce signed/notarized
          # builds, set CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
          # / APPLE_TEAM_ID secrets and remove this env var.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --publish never

      - name: List build output
        run: ls -la dist/

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeadStack-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
